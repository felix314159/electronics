<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Room &amp; Work Room — Air Quality</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e0e0e0; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 1.4rem; color: #fff; }
  #status { text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 16px; }
  .room-bar {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .room-toggle {
    --room-color: #aaa;
    background: #171923; color: #777; border: 1px solid #333; border-radius: 999px;
    padding: 7px 14px; cursor: pointer; font-size: 0.9rem; transition: all .15s;
  }
  .room-toggle::before { content: ""; display: inline-block; width: 9px; height: 9px;
    margin-right: 7px; border-radius: 50%; background: #555; }
  .room-toggle.active { color: #fff; border-color: var(--room-color); background: #202330; }
  .room-toggle.active::before { background: var(--room-color); }
  .range-bar {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .range-bar button {
    background: #1e2030; color: #aaa; border: 1px solid #333; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font-size: 0.85rem; transition: all .15s;
  }
  .range-bar button:hover { background: #2a2d42; color: #fff; }
  .range-bar button.active { background: #3b5bdb; color: #fff; border-color: #3b5bdb; }
  .chart-wrap {
    background: #181a24; border-radius: 10px; padding: 16px; margin-bottom: 18px;
    border: 1px solid #23263a;
  }
  .chart-wrap h2 { font-size: 1rem; margin-bottom: 10px; color: #ccc; }
  canvas { width: 100% !important; }
</style>
</head>
<body>
<h1 id="page-title">Sleep Room &amp; Work Room</h1>
<div id="status">loading...</div>
<div class="room-bar" aria-label="Visible rooms">
  <button class="room-toggle active" data-device="pico-2-w-1" aria-pressed="true"
    style="--room-color: #5bc0eb">Sleep Room</button>
  <button class="room-toggle active" data-device="work-room" aria-pressed="true"
    style="--room-color: #f4a261">Work Room</button>
</div>
<div class="range-bar">
  <button data-range="60">1 min</button>
  <button data-range="600" class="active">10 min</button>
  <button data-range="3600">1 hour</button>
  <button data-range="86400">1 day</button>
  <button data-range="604800">1 week</button>
  <button data-range="2592000">1 month</button>
  <button data-range="31536000">1 year</button>
  <button data-range="0">all time</button>
</div>
<div class="chart-wrap"><h2>CO2 (ppm)</h2><canvas id="chart-co2"></canvas></div>
<div class="chart-wrap"><h2>Temperature (&deg;C)</h2><canvas id="chart-temp"></canvas></div>
<div class="chart-wrap"><h2>Relative Humidity (%)</h2><canvas id="chart-humid"></canvas></div>

<script>
const DEVICES = [
  { id: "pico-2-w-1", label: "Sleep Room", color: "#5bc0eb" },
  { id: "work-room", label: "Work Room", color: "#f4a261" },
];
const selectedDevices = new Set(DEVICES.map(device => device.id));

function makeChart(canvasId, yUnit) {
  return new Chart(document.getElementById(canvasId), {
    type: "line",
    data: { datasets: DEVICES.map(device => ({
      device: device.id,
      label: device.label,
      data: [],
      borderColor: device.color,
      backgroundColor: device.color,
      borderWidth: 1.7,
      pointRadius: 0,
      fill: false,
      tension: 0.25,
    })) },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { type: "time", time: { tooltipFormat: "yyyy-MM-dd HH:mm:ss" },
          ticks: { color: "#666", maxTicksLimit: 10 }, grid: { color: "#222" } },
        y: { ticks: { color: "#666", callback: v => parseFloat(v.toFixed(2)) + yUnit }, grid: { color: "#222" } }
      },
      plugins: {
        legend: {
          display: true,
          labels: { color: "#aaa", usePointStyle: true, pointStyle: "line" },
          onClick: (_event, item) => toggleDevice(item.datasetIndex),
        }
      }
    }
  });
}

const charts = {
  co2:   makeChart("chart-co2",   " ppm"),
  temp:  makeChart("chart-temp",  " C"),
  humid: makeChart("chart-humid", " %"),
};

// resize canvases
document.querySelectorAll("canvas").forEach(c => c.parentElement.style.height = "220px");

let currentRange = 600;

function selectedTitle() {
  const selected = DEVICES.filter(device => selectedDevices.has(device.id));
  return selected.map(device => device.label).join(" & ");
}

function updateDeviceVisibility() {
  for (const chart of Object.values(charts)) {
    chart.data.datasets.forEach((dataset, index) => {
      chart.setDatasetVisibility(index, selectedDevices.has(dataset.device));
    });
    chart.update();
  }

  document.querySelectorAll(".room-toggle").forEach(button => {
    const active = selectedDevices.has(button.dataset.device);
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", active);
  });

  const title = selectedTitle();
  document.getElementById("page-title").textContent = title;
  document.title = title + " — Air Quality";
}

function toggleDevice(datasetIndexOrId) {
  const deviceId = typeof datasetIndexOrId === "number"
    ? DEVICES[datasetIndexOrId].id
    : datasetIndexOrId;

  if (selectedDevices.has(deviceId)) {
    if (selectedDevices.size === 1) return;
    selectedDevices.delete(deviceId);
  } else {
    selectedDevices.add(deviceId);
  }
  updateDeviceVisibility();
}

document.querySelectorAll(".room-toggle").forEach(button => {
  button.addEventListener("click", () => toggleDevice(button.dataset.device));
});

function setActive(btn) {
  document.querySelectorAll(".range-bar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

document.querySelectorAll(".range-bar button").forEach(btn => {
  btn.addEventListener("click", () => {
    currentRange = parseInt(btn.dataset.range);
    setActive(btn);
    fetchData();
  });
});

function updateChart(chart, points, xMin, xMax) {
  chart.data.datasets.forEach(dataset => {
    dataset.data = points[dataset.device] || [];
  });
  chart.options.scales.x.min = xMin;
  chart.options.scales.x.max = xMax;
  chart.update();
}

async function fetchData() {
  try {
    const now = new Date();
    const xMax = now;
    let xMin = currentRange > 0 ? new Date(now.getTime() - currentRange * 1000) : undefined;

    const res = await fetch("/api/readings?range=" + currentRange);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || "server returned " + res.status);
    }
    const rows = await res.json();
    const co2 = {}, temp = {}, humid = {};
    for (const device of DEVICES) {
      co2[device.id] = [];
      temp[device.id] = [];
      humid[device.id] = [];
    }
    for (const r of rows) {
      if (!(r.device in co2)) continue;
      const t = new Date(r.t);
      co2[r.device].push({ x: t, y: r.co2 });
      temp[r.device].push({ x: t, y: r.temp });
      humid[r.device].push({ x: t, y: r.hum });
    }
    // avoid empty space before the first measurement
    if (rows.length) {
      const first = new Date(rows[0].t);
      if (xMin === undefined || first > xMin) xMin = first;
    }
    updateChart(charts.co2, co2, xMin, xMax);
    updateChart(charts.temp, temp, xMin, xMax);
    updateChart(charts.humid, humid, xMin, xMax);
    document.getElementById("status").textContent =
      rows.length ? "showing " + rows.length + " readings" : "no data in this range";
  } catch (e) {
    document.getElementById("status").textContent = "fetch error: " + e;
  }
}

let refreshTimer = null;
function startRefresh() {
  if (refreshTimer === null) refreshTimer = setInterval(fetchData, 5000);
}
function stopRefresh() {
  if (refreshTimer !== null) { clearInterval(refreshTimer); refreshTimer = null; }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { fetchData(); startRefresh(); }
  else { stopRefresh(); }
});
window.addEventListener("pageshow", () => { fetchData(); startRefresh(); });
window.addEventListener("pagehide", stopRefresh);

fetchData();
startRefresh();
</script>
</body>
</html>
